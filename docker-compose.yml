services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: kenya_location
      POSTGRES_USER: location
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/002_seed_demo.sql:/docker-entrypoint-initdb.d/002_seed_demo.sql:ro
      - ./database/003_places_schema.sql:/docker-entrypoint-initdb.d/003_places_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U location -d kenya_location"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingestion:
    build: ./ingestion
    environment:
      DATABASE_URL: postgresql://location:${POSTGRES_PASSWORD}@db:5432/kenya_location
      GIS_ROOT: /data/gis
      PLACES_SOURCE_ZIP: /data/places/13308773.zip
    volumes:
      - ./data/gis:/data/gis
      - ./data/places:/data/places
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: ./src/KenyaLocation.Api/Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=kenya_location;Username=location;Password=${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ingestion:
        condition: service_completed_successfully

volumes:
  pgdata:
