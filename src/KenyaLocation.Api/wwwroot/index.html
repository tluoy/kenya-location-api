<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kenya Location Intelligence API</title>
    <style>
      body {
        font-family: system-ui;
        max-width: 1000px;
        margin: 40px auto;
        padding: 0 20px;
      }
      input,
      button {
        padding: 10px;
        margin: 4px;
      }
      pre {
        background: #f4f4f4;
        padding: 15px;
        overflow: auto;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Kenya Location Intelligence API</h1>
    <p>Demo MVP — GPS reverse lookup, search and nearest geographic units.</p>
    <div class="grid">
      <section>
        <h2>Reverse GPS</h2>
        <input id="lat" value="-0.2827" placeholder="latitude" /><input
          id="lon"
          value="34.7519"
          placeholder="longitude"
        /><button onclick="reverse()">Resolve</button>
      </section>
      <section>
        <h2>Search</h2>
        <input id="q" value="Kakamega" placeholder="place name" /><button
          onclick="search()"
        >
          Search
        </button>
      </section>
    </div>
    <h2>Result</h2>
    <pre id="out">Ready.</pre>
    <script>
      const out = document.getElementById("out");
      async function reverse() {
        const lat = document.getElementById("lat").value,
          lon = document.getElementById("lon").value;
        out.textContent = JSON.stringify(
          await fetch(
            `/api/v1/geolocation/reverse?latitude=${lat}&longitude=${lon}`,
          ).then((r) => r.json()),
          null,
          2,
        );
      }
      async function search() {
        const q = encodeURIComponent(document.getElementById("q").value);
        out.textContent = JSON.stringify(
          await fetch(`/api/v1/locations/search?q=${q}`).then((r) => r.json()),
          null,
          2,
        );
      }
    </script>
  </body>
</html>
