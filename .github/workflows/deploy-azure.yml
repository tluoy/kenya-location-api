name: Deploy Azure

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: azure-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy release to Azure
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a semantic-version release tag: $RELEASE_TAG"
            exit 1
          fi

          git fetch --force origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

          actual_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"

          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Release tag does not point to the tested commit."
            exit 1
          fi

          echo "Verified $RELEASE_TAG at $actual_sha"

      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name kenyalocationapidev

      - name: Build and push release image
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          IMAGE="kenyalocationapidev.azurecr.io/kenya-location-api:${RELEASE_TAG}"

          docker build \
            -f src/KenyaLocation.Api/Dockerfile \
            -t "$IMAGE" \
            .

          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update existing Azure Container App
        run: |
          az containerapp update \
            --name kenya-location-api-dev \
            --resource-group kenya-location-api-dev-rg \
            --image "$IMAGE"

      - name: Verify deployed API
        shell: pwsh
        run: ./scripts/azure-smoke-tests.ps1
