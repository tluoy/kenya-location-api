
name: Deploy Azure

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: azure-production-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Run CI before deployment
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy release to Azure
    needs: test
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic-version tag: $RELEASE_TAG"
            exit 1
          fi

          echo "Preparing release $RELEASE_TAG"

      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name kenyalocationapidev

      - name: Build and push release image
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          IMAGE="kenyalocationapidev.azurecr.io/kenya-location-api:${RELEASE_TAG}"

          docker build \
            -f src/KenyaLocation.Api/Dockerfile \
            -t "$IMAGE" \
            .

          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update existing Azure Container App
        run: |
          az containerapp update \
            --name kenya-location-api-dev \
            --resource-group kenya-location-api-dev-rg \
            --image "$IMAGE"

      - name: Verify deployed API
        shell: pwsh
        run: ./scripts/azure-smoke-tests.ps1
